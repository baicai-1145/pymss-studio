name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Syntax-level gates that historically failed only at release time
  # (PowerShell parse errors, broken workflow YAML) fail here, minutes after push.
  fast-checks:
    name: Fast checks (workflows, scripts, manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Workflows
        run: |
          # actionlint in CI implies a full schema + expression pass; it also catches the
          # workflow-file mistakes that otherwise surface as opaque "workflow file issue"
          # failures with no logs.
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Shellcheck build scripts
        shell: bash
        run: |
          # Running shellcheck also gives a full bash syntax pass; it catches the quoting and
          # word-splitting mistakes that only otherwise surface on the release runner.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          git ls-files 'scripts/*.sh' '.github/**/*.sh' | while read -r script; do
            shellcheck "$script"
          done

      - name: PowerShell script syntax check
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem scripts/*.ps1) + @(Get-ChildItem .github/actions/*/*.ps1 -ErrorAction SilentlyContinue)
          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              foreach ($error in $parseErrors) {
                Write-Host "::error file=$($script.FullName),line=$($error.Extent.StartLineNumber)::$($error.Message)"
              }
            }
          }
          if ($failed) { throw "PowerShell parse errors found" }
          Write-Host "All $($scripts.Count) PowerShell scripts parse cleanly"

      - name: Runtime manifest sanity check
        shell: bash
        run: python3 scripts/check_runtime_manifest.py

  frontend-tests:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test:frontend

      - name: Build frontend (type check included)
        run: pnpm build

  python-tests:
    name: Python worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-ci.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu
          python -m pip install --disable-pip-version-check --prefer-binary \
            -r python/requirements-ci.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests/python -t tests -p "test_*.py"

  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the release platform; macOS guards the path logic in python/worker.rs
        # that is compiled everywhere but only exercised on the release platform otherwise.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
