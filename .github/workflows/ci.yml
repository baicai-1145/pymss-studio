name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Syntax-level gates that historically failed only at release time
  # (PowerShell parse errors, broken workflow YAML) fail here, minutes after push.
  fast-checks:
    name: Fast checks (workflows, scripts, manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Workflows
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Shellcheck build scripts
        shell: bash
        run: |
          # shellcheck implies a full bash syntax pass; it also catches the quoting and
          # word-splitting mistakes that only otherwise surface on the release runner.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          git ls-files 'scripts/*.sh' '.github/**/*.sh' | while read -r script; do
            shellcheck "$script"
          done

      - name: PowerShell script syntax check
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem scripts/*.ps1) + @(Get-ChildItem .github/actions/*/*.ps1 -ErrorAction SilentlyContinue)
          $failed = $false
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              foreach ($error in $parseErrors) {
                Write-Host "::error file=$($script.FullName),line=$($error.Extent.StartLineNumber)::$($error.Message)"
              }
            }
          }
          if ($failed) { throw "PowerShell parse errors found" }
          Write-Host "All $($scripts.Count) PowerShell scripts parse cleanly"

      - name: Runtime manifest sanity check
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("python/runtime-manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("manifestVersion"), "manifestVersion missing"
          assert manifest.get("python"), "python version missing"
          for name, requirement in manifest["common"].items():
              assert isinstance(requirement, str) and requirement.strip(), f"common.{name} has an empty requirement"
          for name, spec in manifest["backends"].items():
              assert spec.get("platforms"), f"backend {name} lacks platforms"
              torch = spec.get("torch") or {}
              has_torch = bool(torch.get("requirement") or torch.get("requirements") or torch.get("rocmRequirements"))
              assert has_torch, f"backend {name} has no torch requirement"
          print("runtime-manifest.json OK:", ", ".join(manifest["backends"]))
          PY

  frontend-tests:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test:frontend

      - name: Build frontend (type check included)
        run: pnpm build

  python-tests:
    name: Python worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements-ci.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --prefer-binary \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu
          python -m pip install --disable-pip-version-check --prefer-binary \
            -r python/requirements-ci.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests/python -t tests -p "test_*.py"

  rust-tests:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
