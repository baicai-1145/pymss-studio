name: Release Rehearsal

# Runs the real release packaging end to end without publishing anything. Historically
# the packaging steps were only ever executed on tag push, so PowerShell errors, tool
# download changes, and staging bugs surfaced as broken releases. A green rehearsal
# means the next tag is packaging-verified; a red one is a fix branch, not an incident.
on:
  workflow_dispatch:
    inputs:
      backends:
        description: Comma-separated package sets to rehearse (cpu, cuda, rocm)
        required: false
        default: cpu
  schedule:
    # Weekly, Sunday 21:00 UTC — catches rot in downloads and runner images early.
    - cron: '0 21 * * 0'

concurrency:
  group: release-rehearsal
  cancel-in-progress: true

jobs:
  # Reusable-workflow call jobs may not reference matrix in their job-level if,
  # so each rehearsed package set is its own explicit job. Scheduled runs exercise
  # everything; manual runs default to cpu only.
  rehearse-windows-cpu:
    name: Rehearse Windows cpu release
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.inputs.backends || '', 'cpu')
    uses: ./.github/workflows/release-windows.yml
    with:
      version: 0.0.0-rehearsal.${{ github.run_number }}
      package_set: cpu
    permissions:
      contents: read

  rehearse-windows-cuda:
    name: Rehearse Windows cuda release
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.inputs.backends || '', 'cuda')
    uses: ./.github/workflows/release-windows.yml
    with:
      version: 0.0.0-rehearsal.${{ github.run_number }}
      package_set: cuda
    permissions:
      contents: read

  rehearse-windows-rocm:
    name: Rehearse Windows rocm release
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.inputs.backends || '', 'rocm')
    uses: ./.github/workflows/release-windows.yml
    with:
      version: 0.0.0-rehearsal.${{ github.run_number }}
      package_set: rocm
    permissions:
      contents: read

  rehearse-macos:
    name: Rehearse macOS release
    if: >-
      github.event_name == 'schedule' ||
      contains(github.event.inputs.backends || '', 'cpu')
    uses: ./.github/workflows/release-macos.yml
    with:
      version: 0.0.0-rehearsal.${{ github.run_number }}
    permissions:
      contents: read
